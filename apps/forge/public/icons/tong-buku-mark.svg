<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Tong Buku mark</title>
  <desc id="desc">A precise blue gripper carrying a mint document with amber and cyan motion marks.</desc>
  <defs>
    <linearGradient id="blue" x1="45" y1="25" x2="150" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#49A3FF"/><stop offset=".55" stop-color="#1665FF"/><stop offset="1" stop-color="#0B3FC7"/>
    </linearGradient>
    <linearGradient id="mint" x1="100" y1="84" x2="205" y2="215" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9CFFF0"/><stop offset="1" stop-color="#4FE0CF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 132h29" stroke="#FFB020" stroke-width="8"/>
    <path d="M30 153h36" stroke="#72F2E2" stroke-width="7"/>
    <path d="M43 174h29" stroke="#2B7BFF" stroke-width="7"/>
    <circle cx="105" cy="42" r="18" stroke="url(#blue)" stroke-width="12" filter="url(#glow)"/>
    <path d="M94 60 69 126l36 25 23-72" stroke="url(#blue)" stroke-width="14" filter="url(#glow)"/>
    <path d="M115 61 151 105" stroke="url(#blue)" stroke-width="14" filter="url(#glow)"/>
    <path d="M96 126 129 103" stroke="url(#blue)" stroke-width="12"/>
    <path d="M119 99h67l31 31v74a16 16 0 0 1-16 16h-82a16 16 0 0 1-16-16v-89a16 16 0 0 1 16-16Z" fill="#08111D" stroke="url(#mint)" stroke-width="11" filter="url(#glow)"/>
    <path d="M186 100v30h30" stroke="url(#mint)" stroke-width="10"/>
    <path d="M130 150h56M130 173h56M130 196h39" stroke="#77F1E1" stroke-width="9"/>
  </g>
</svg>
