name: Materialize and verify ChatSaid Taurus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ hashFiles('.bootstrap/chatsaid-taurus-source.zip') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract complete source tree
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/.bootstrap/chatsaid-taurus-source.zip"
          temp_dir="$(mktemp -d)"
          unzip -q "$archive" -d "$temp_dir"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$temp_dir"/. "$GITHUB_WORKSPACE"/

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify complete Talk → Plan → Make loop
        run: |
          npm install --ignore-scripts
          npm run verify

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Taurus Pocket Android
        working-directory: apps/pocket-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatSaid Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build complete ChatSaid Taurus system"
          git push origin HEAD:main

# Triggered through the GitHub contents API so Actions verifies before materializing source.
