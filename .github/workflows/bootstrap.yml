name: Materialize and verify ChatSaid Taurus

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main bootstrap commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract complete source tree
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/.bootstrap/chatsaid-taurus-source.zip"
          test -f "$archive"
          temp_dir="$(mktemp -d)"
          unzip -q "$archive" -d "$temp_dir"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$temp_dir"/. "$GITHUB_WORKSPACE"/

      - name: Install complete build contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts.verify = 'npm run check && npm test && npm run smoke';
          pkg.scripts.ci = 'npm run verify';
          pkg.scripts['android:debug'] = 'cd apps/pocket-android && gradle --no-daemon :app:assembleDebug';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'YAML'
          name: Build and verify ChatSaid Taurus

          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            core:
              name: Talk → Plan → Make
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: npm
                - run: npm ci --ignore-scripts
                - run: npm run verify

            android:
              name: Taurus Pocket Android
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: android-actions/setup-android@v3
                - name: Install Android API 36
                  run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '8.11.1'
                - name: Compile debug APK
                  working-directory: apps/pocket-android
                  run: gradle --no-daemon :app:assembleDebug
                - uses: actions/upload-artifact@v4
                  with:
                    name: taurus-pocket-debug
                    path: apps/pocket-android/app/build/outputs/apk/debug/app-debug.apk
                    if-no-files-found: error
          YAML
          npm install --package-lock-only --ignore-scripts

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify complete Talk → Plan → Make loop
        run: |
          npm ci --ignore-scripts
          npm run verify

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Taurus Pocket Android
        working-directory: apps/pocket-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload verified Android APK
        uses: actions/upload-artifact@v4
        with:
          name: taurus-pocket-debug
          path: apps/pocket-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit verified source tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatSaid Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build complete ChatSaid Taurus system"
          git push origin HEAD:main
